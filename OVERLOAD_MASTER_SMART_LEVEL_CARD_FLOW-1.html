.wrap{padding:18px 16px 40px;max-width:640px;margin:auto}.hidden{display:none!important}.section{margin-bottom:20px}.section-title{font-size:13px;font-weight:700;margin-bottom:9px}.sub{font-size:11.5px;color:var(--dim)}.card{background:var(--panel);border:1px solid #262933;border-radius:10px;padding:12px 14px}.soft-accent{background:rgba(var(--accent-rgb),.08);border-color:rgba(var(--accent-rgb),.45)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{text-align:center;padding:12px 6px}.metric .num{font-family:Oswald;font-size:24px;font-weight:700;line-height:1.05}.metric .lab{font-size:9.5px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:600;color:var(--muted)}

.input,.select{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px}.input:focus,.select:focus{outline:2px solid var(--accent);outline-offset:1px}
.label{font-size:11.5px;color:var(--muted);margin-bottom:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.pills{display:flex;flex-wrap:wrap;gap:5px}.pill{padding:3px 8px;border-radius:999px;border:1px solid var(--border);font-size:11px;color:var(--muted)}.pill.done{border-color:var(--good);color:var(--good);background:rgba(95,174,122,.12)}

.logdate{display:flex;align-items:center;justify-content:space-between}.dateinput{width:118px;background:var(--chip);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 8px}
.exercise{margin-bottom:7px}.exercise-head{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text)}.exercise-head.active{border-color:var(--accent);border-radius:8px 8px 0 0;background:rgba(var(--accent-rgb),.12);color:var(--accent)}
.entry{border:1px solid var(--accent);border-top:0;border-radius:0 0 8px 8px;padding:12px;background:#191B22}.challenge-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.mini{background:var(--panel);border:1px solid #262933;border-radius:10px;padding:10px 11px}.mini-title{font-size:9.5px;font-weight:700;margin-bottom:5px}.mini-big{font-family:"IBM Plex Mono";font-size:16px;font-weight:700}
.sethead,.setrow{display:grid;grid-template-columns:32px 1fr 1fr 70px 24px;gap:7px;align-items:center}.sethead{font-size:9.5px;color:var(--dim);margin-bottom:5px}.setrow{margin-bottom:7px}.setinput{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 8px;font-family:"IBM Plex Mono";font-size:14px}.setinput:focus{outline:2px solid var(--accent);outline-offset:1px}.remove{border:0;background:transparent;color:var(--dim);font-size:16px}
.level-push{border:1px solid var(--accent);background:rgba(var(--accent-rgb),.1);border-radius:10px;padding:11px 12px;margin:8px 0;animation:pulse 1.5s ease-in-out infinite alternate}@keyframes pulse{from{box-shadow:0 0 0 rgba(var(--accent-rgb),0)}to{box-shadow:0 0 15px rgba(var(--accent-rgb),.18)}}
.history-row{padding:9px 0;border-bottom:1px solid #262933}.history-row:last-child{border-bottom:0}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calday{aspect-ratio:1;border:1px solid #262933;border-radius:8px;background:var(--panel);color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative}.calday.logged{border-color:var(--accent);color:var(--text)}.calday.logged:after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.chart{width:100%;height:220px;background:var(--panel);border:1px solid #262933;border-radius:10px;padding:10px}.chart svg{width:100%;height:100%;overflow:visible}.chart text{fill:var(--muted);font-size:10px}.chart line.grid{stroke:#2E3139;stroke-width:1}.chart polyline{fill:none;stroke:var(--accent);stroke-width:3}.chart circle{fill:var(--accent)}
.chart-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.chart-tab{font-size:10px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--muted);padding:5px 8px}.chart-tab.active{border-color:var(--accent);color:var(--accent);background:rgba(var(--accent-rgb),.08)}
.ladder{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.weight-card{min-width:92px;text-align:center;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--panel)}.weight-card.mastered{border-color:var(--good);color:var(--good)}.weight-card.current{border-color:var(--accent);color:var(--accent)}.weight-card.unlockable{border-color:var(--accent);cursor:pointer}
.plan-day{margin-bottom:8px}.toggle-group{display:flex;flex-wrap:wrap;gap:6px}.toggle{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:999px;padding:6px 9px;font-size:11px}.toggle.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.1);color:var(--accent)}
.exercise-config{padding:11px;border-top:1px solid #262933}.config-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.theme-row{display:flex;gap:8px;flex-wrap:wrap}.theme{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.theme.selected{border-color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.modal{width:min(100%,330px);background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:24px 20px;text-align:center;animation:pop .25s ease}@keyframes pop{from{transform:scale(.94);opacity:.3}to{transform:scale(1);opacity:1}}.modal.master{border-color:var(--good);box-shadow:0 0 30px rgba(95,174,122,.2)}

/* Refined Weekly Dashboard — restrained, single-accent visual system */
.weekly-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.weekly-date{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.weekly-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.weekly-metric{background:var(--panel);border:1px solid #2A2D35;border-radius:12px;padding:13px 8px;text-align:center}
.weekly-metric-icon{
  width:36px;height:36px;margin:0 auto 7px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
  background:rgba(var(--accent-rgb),.07);
  border:1px solid rgba(var(--accent-rgb),.16);
}
.weekly-metric-icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.weekly-metric-num{font-family:Oswald,sans-serif;font-size:27px;font-weight:700;line-height:1}
.weekly-metric-label{font-size:10.5px;font-weight:600;margin-top:5px}
.weekly-metric-sub{font-size:9.5px;color:var(--dim);margin-top:2px}
.weekly-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.weekly-section-title{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:13px;font-weight:700}
.weekly-see{border:0;background:transparent;color:var(--muted);font-size:10.5px;padding:4px}
.weekly-targets{display:flex;flex-direction:column;gap:8px}
.weekly-target{background:var(--panel);border:1px solid #2A2D35;border-radius:12px;padding:12px 13px}
.weekly-target.mastery{border-color:rgba(95,174,122,.38)}
.target-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.target-title{font-size:13px;font-weight:700}
.target-level{font-size:11px;color:var(--muted);margin-top:2px}
.target-side{text-align:right}
.target-big{font-family:Oswald,sans-serif;font-size:18px;font-weight:700;color:var(--accent);line-height:1.05}
.weekly-target.mastery .target-big{color:var(--good)}
.target-sub{font-size:10px;color:var(--muted);margin-top:2px}
.target-reps{display:flex;gap:6px;margin:10px 0 8px}
.target-rep{width:34px;height:34px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:12px}
.target-rep.hit{border-color:var(--accent);color:var(--accent);background:rgba(var(--accent-rgb),.06)}
.weekly-target.mastery .target-rep.hit{border-color:var(--good);color:var(--good);background:rgba(95,174,122,.06)}
.target-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px}
.target-next{font-size:10.5px;color:var(--muted)}
.weekplan-list{display:flex;flex-direction:column;gap:5px}
.weekplan-row{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto 16px;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid #2A2D35;color:var(--text);border-radius:10px;padding:9px 11px}
.weekplan-row.today{border-color:var(--accent);background:rgba(var(--accent-rgb),.045)}
.weekplan-date{text-align:center}
.weekplan-date .dow{font-family:Oswald,sans-serif;font-size:9px;color:var(--dim);text-transform:uppercase}
.weekplan-date .daynum{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:700}
.weekplan-groups{display:flex;flex-wrap:wrap;gap:5px}
.weekplan-pill{border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:10.5px;color:var(--muted);background:transparent}
.weekplan-pill.done{border-color:rgba(95,174,122,.55);color:var(--good);background:rgba(95,174,122,.06)}
.weekplan-count{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--dim)}
.weekplan-count.done{color:var(--good)}
.weekly-wins{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.weekly-win{background:var(--panel);border:1px solid #2A2D35;border-radius:10px;padding:10px}
.weekly-win-kind{font-size:9.5px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.weekly-win-title{font-size:11.5px;font-weight:600;margin-top:4px}
.weekly-win-detail{font-size:10.5px;color:var(--muted);margin-top:2px}
.weekly-volume-card{width:100%;text-align:left;color:var(--text);background:var(--panel);border:1px solid #2A2D35;border-radius:11px;padding:12px 13px}
.weekly-volume-title{font-size:12px;font-weight:700}
.weekly-volume-sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.weekly-volume-mini{display:flex;gap:3px;margin-top:9px}
.weekly-volume-mini span{height:5px;flex:1;background:#30333B;border-radius:99px}
.weekly-volume-mini span.hit{background:var(--accent)}
.weekly-volume-mini span.complete{background:var(--good)}
@media(max-width:520px){
  .weekly-metrics{grid-template-columns:repeat(4,1fr);gap:5px}
  .weekly-metric{padding:11px 4px}
  .weekly-metric-num{font-size:24px}
  .weekly-metric-label{font-size:9.5px}
  .weekly-metric-sub{display:none}
  .weekly-wins{grid-template-columns:1fr 1fr}
  .weekly-win:last-child{grid-column:1/-1}
}


.weekly-carousel-wrap{position:relative}
.weekly-carousel-viewport{
  overflow:hidden;
  touch-action:pan-y;
  border-radius:12px;
}
.weekly-carousel-track{
  display:flex;
  transition:transform .28s ease;
  will-change:transform;
}
.weekly-carousel-slide{
  min-width:100%;
}
.weekly-carousel-nav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:9px;
}
.carousel-arrow{
  width:30px;height:30px;border-radius:50%;
  border:1px solid #30333B;
  background:var(--panel);
  color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;
}
.carousel-arrow:disabled{opacity:.25;cursor:default}
.carousel-dots{display:flex;gap:6px;align-items:center;justify-content:center}
.carousel-dot{
  width:6px;height:6px;border-radius:50%;
  border:0;padding:0;background:#3A3D45;
}
.carousel-dot.active{background:var(--accent)}
.weekly-carousel-count{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--dim)}


.muscle-group-manager{
  background:var(--panel);
  border:1px solid #2A2D35;
  border-radius:10px;
  padding:12px 13px;
  margin-bottom:12px;
}
.muscle-add-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:end;
}
.muscle-group-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:12px;
}
.muscle-group-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-top:1px solid #292C34;
  padding-top:8px;
}
.muscle-group-item:first-child{
  border-top:0;
  padding-top:0;
}
.muscle-group-name{
  font-size:12.5px;
  font-weight:600;
}
.muscle-group-meta{
  font-size:10.5px;
  color:var(--muted);
  margin-top:2px;
}
.remove-group-btn{
  border:1px solid #3A3D45;
  background:transparent;
  color:var(--muted);
  border-radius:8px;
  padding:6px 9px;
  font-size:11px;
}
.remove-group-btn:hover{
  border-color:var(--bad);
  color:var(--bad);
}
@media(max-width:430px){
  .muscle-add-row{grid-template-columns:1fr}
}


.weekplan-item{border-radius:10px}
.weekplan-row.expanded{
  border-radius:10px 10px 0 0;
  border-bottom-color:#343741;
}
.weekplan-expand{
  background:#191B22;
  border:1px solid #2A2D35;
  border-top:0;
  border-radius:0 0 10px 10px;
  padding:10px 12px 11px;
  animation:weekPlanOpen .18s ease;
}
@keyframes weekPlanOpen{
  from{opacity:.35;transform:translateY(-4px)}
  to{opacity:1;transform:translateY(0)}
}
.weekplan-exercise{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:7px 0;
  border-bottom:1px solid #292C34;
}
.weekplan-exercise:last-child{border-bottom:0;padding-bottom:1px}
.weekplan-exercise-name{font-size:12px;font-weight:600}
.weekplan-exercise-group{font-size:9.5px;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
.weekplan-prescription{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  color:var(--muted);
  white-space:nowrap;
  text-align:right;
}
.weekplan-chevron{
  color:var(--dim);
  transition:transform .16s ease;
}
.weekplan-chevron.open{transform:rotate(90deg)}


.app-brand-icon{
  width:38px;
  height:38px;
  border-radius:9px;
  object-fit:cover;
  display:block;
  border:1px solid #2B2E36;
}


/* Full log-page restoration */
.log-exercise-summary{
  display:flex;align-items:center;justify-content:center;gap:10px;
  color:var(--muted);font-size:12px;margin-bottom:10px
}
.log-exercise-summary .weight{color:var(--accent);font-weight:700;font-family:"IBM Plex Mono",monospace}
.progress-streak{
  display:flex;align-items:center;justify-content:center;gap:7px;
  color:var(--accent);font-size:12px;font-weight:700;margin:8px 0 10px
}
.view-full-progress{
  width:100%;border:1px solid var(--border);background:transparent;
  color:var(--good);border-radius:9px;padding:10px 12px;font-weight:600;
  margin-bottom:12px
}
.mastery-card{
  background:var(--panel);border:1px solid #2A2D35;border-radius:11px;
  padding:12px 13px;margin-bottom:10px
}
.mastery-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mastery-left{display:flex;align-items:center;gap:10px}
.mastery-icon{
  width:40px;height:40px;border-radius:10px;
  background:rgba(var(--accent-rgb),.12);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-size:20px
}
.mastery-title{font-size:12px;font-weight:700}
.mastery-pct{font-family:"IBM Plex Mono",monospace;font-size:20px;color:var(--good);font-weight:700}
.mastery-segments{display:flex;gap:4px;margin:10px 0 8px}
.mastery-segments span{height:8px;flex:1;background:#2D3038;border-radius:99px}
.mastery-segments span.on{background:var(--good)}
.mastery-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mastery-foot .left,.mastery-foot .right{font-size:10.5px;color:var(--muted)}
.mastery-foot .left b{color:var(--good)}
.challenge-card{
  background:var(--panel);border:1px solid #2A2D35;border-radius:10px;padding:11px
}
.challenge-title{

  display:flex;

  font-size:12px;
  font-weight:700;

.plan-manager-card[open] summary{

}
.plan-manager-body{padding:11px 12px}
.library-group-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  padding:8px 0;
  border-top:1px solid #272A31;
}
.library-group-name{font-size:12.5px;font-weight:650}
.plan-danger-zone{

}

}
</style>


<style id="overload-rep-picker">
.rep-picker{margin:8px 0 10px;padding:9px 10px;border:1px solid #2A2D35;border-radius:10px;background:var(--panel)}
.rep-picker-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.rep-picker-title{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.rep-picker-buttons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rep-choice{min-height:40px;border:1px solid var(--border);border-radius:9px;background:#1E2128;color:var(--text);font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:700}

.rep-other-wrap.show{display:flex}

<style id="overload-next-set-timer-bigger">

<style id="overload-bodyweight-goal">

}

<style id="overload-finish-celebration">
.exercise-finish-card{border-color:var(--good)!important;background:rgba(95,174,122,.06)!important}
.finish-celebration{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.finish-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(95,174,122,.12);font-size:21px}
.finish-copy{min-width:0}
.finish-headline{font-family:Oswald,sans-serif;font-size:17px;font-weight:800;color:var(--good)}
.finish-subline{margin-top:2px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:700}
.finish-detail{margin-top:3px;color:var(--muted);font-size:10.5px}
.finish-celebration .btn{grid-column:1/-1;width:100%}
@keyframes finishPop{0%{transform:scale(.97);opacity:.55}65%{transform:scale(1.015);opacity:1}100%{transform:scale(1);opacity:1}}
.exercise-finish-card.finish-pop{animation:finishPop .38s ease}
.current-session-card{margin:12px 0;padding:10px 11px;border:1px solid rgba(95,174,122,.5);border-radius:10px;background:rgba(95,174,122,.06);display:grid;grid-template-columns:34px minmax(0,1fr);gap:9px;align-items:center}
.current-session-check{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--good);background:rgba(95,174,122,.12);font-weight:800}
.current-session-title{font-size:10px;font-weight:800;color:var(--good)}
.current-session-main{margin-top:2px;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700}
.current-session-sub{margin-top:2px;color:var(--muted);font-size:9.5px}
@media(prefers-reduced-motion:reduce){.exercise-finish-card.finish-pop{animation:none}}
</style>


<style id="overload-animated-finish-flame">
@keyframes flameFlicker{
  0%{transform:translateY(0) scale(1) rotate(-2deg)}
  20%{transform:translateY(-2px) scale(1.04,.98) rotate(2deg)}
  40%{transform:translateY(0) scale(.98,1.05) rotate(-1deg)}
  60%{transform:translateY(-3px) scale(1.06,.97) rotate(3deg)}
  80%{transform:translateY(-1px) scale(1.01,1.03) rotate(-2deg)}
  100%{transform:translateY(0) scale(1) rotate(-2deg)}
}
.finish-icon.finish-flame{
  animation:flameFlicker .72s ease-in-out infinite;
  transform-origin:50% 80%;
}
@media(prefers-reduced-motion:reduce){
  .finish-icon.finish-flame{animation:none}
}
</style>


<style id="overload-log-next-pulse">
@keyframes logNextPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(var(--accent-rgb),0)}

}
#saveexercise.log-next-pulse{

<style id="overload-workout-loop">
.workout-preview-hero{position:relative;overflow:hidden;border:1px solid rgba(var(--accent-rgb),.55);background:linear-gradient(135deg,rgba(var(--accent-rgb),.16),rgba(var(--accent-rgb),.035) 58%,var(--panel));border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.16)}
.workout-preview-hero:after{content:"";position:absolute;width:150px;height:150px;border:1px solid rgba(var(--accent-rgb),.12);border-radius:50%;right:-70px;top:-80px}
.preview-eyebrow{font-size:9.5px;font-weight:800;letter-spacing:.09em;color:var(--accent);text-transform:uppercase}.preview-title{font-family:Oswald,sans-serif;font-size:24px;font-weight:800;line-height:1.05;margin-top:4px}.preview-summary{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.preview-chip{border:1px solid rgba(var(--accent-rgb),.3);background:rgba(var(--accent-rgb),.08);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700}.preview-chip.mastery{border-color:rgba(95,174,122,.45);color:var(--good);background:rgba(95,174,122,.07)}
.today-target-hero{margin:10px 0 12px;border:1px solid rgba(var(--accent-rgb),.48);background:linear-gradient(135deg,rgba(var(--accent-rgb),.13),rgba(var(--accent-rgb),.035));border-radius:14px;padding:13px}.today-target-hero.mastery{border-color:rgba(95,174,122,.58);background:linear-gradient(135deg,rgba(95,174,122,.12),rgba(95,174,122,.025))}.today-target-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.attempt-badge{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}.today-target-hero.mastery .attempt-badge{color:var(--good)}.target-weight{font-family:Oswald,sans-serif;font-size:21px;font-weight:800}.target-sets-big{display:flex;align-items:center;gap:7px;margin:10px 0}.target-sets-big span{width:42px;height:42px;border-radius:11px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:800;background:#191B22}.target-sets-big span.done{border-color:var(--good);color:var(--good);background:rgba(95,174,122,.07)}.target-delta-line{font-size:11px;color:var(--muted)}.target-delta-line b{color:var(--text)}

<script>
const THEMES={steel:{hex:"#5B9BD9",rgb:"91,155,217"},amber:{hex:"#E8B923",rgb:"232,185,35"},emerald:{hex:"#4FC97A",rgb:"79,201,122"},crimson:{hex:"#E0645A",rgb:"224,100,90"},violet:{hex:"#C08CF0",rgb:"192,140,240"},copper:{hex:"#E08A4E",rgb:"224,138,78"}};
const MSGS=["AWESOME!","LET'S GO!","NICE!","LEVEL UP!","KEEP GOING!","CRUSHED IT!","BIG WIN!","NEXT LEVEL!","LOCKED IN!","LET'S WORK!"];
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], DAYLONG=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const defaultState={
 theme:"steel",
 groups:["Biceps","Triceps","Chest","Back","Traps","Shoulders","Legs","Glutes","Hamstrings"],
 exercises:{
  Biceps:["Dumbbell Curl","Hammer Curl"],Triceps:["Overhead Extension","Tricep Pushdown"],Chest:["Push-Up","Dumbbell Press"],Back:["Pull-Up","Bent-Over Row"],Traps:["Dumbbell Shrug","Face Pull"],Shoulders:["Lateral Raise","Overhead Press"],Legs:["Bodyweight Squat","Walking Lunge"],Glutes:["Hip Thrust"],Hamstrings:["Romanian Deadlift"]
 },
 schedule:{0:[],1:["Chest","Back"],2:["Biceps","Triceps"],3:["Shoulders","Traps"],4:["Glutes","Hamstrings"],5:["Chest","Back"],6:["Biceps","Triceps","Shoulders"]},
 settings:{},
 currentWeights:{"Biceps::Dumbbell Curl":50,"Glutes::Hip Thrust":135,"Shoulders::Lateral Raise":20},
 logs:[],
 bodyweight:[],
 bodyweightGoal:{mode:"lose",target:null},
 achievements:[],
 unlocked:{}
};
function cfgKey(g,e){return g+"::"+e}
function clone(x){return JSON.parse(JSON.stringify(x))}

function ensureDayPlans(){
 if(!state.dayPlans)state.dayPlans={};
 for(let day=0;day<7;day++){
   if(!Array.isArray(state.dayPlans[day])){
     const groups=state.schedule?.[day]||[];
     state.dayPlans[day]=groups.flatMap(g=>(state.exercises[g]||[]).map(e=>({group:g,exercise:e})));
   }
 }
}
function dayPlan(day){ensureDayPlans();return state.dayPlans[day]||[]}
function syncScheduleFromDayPlans(){
 ensureDayPlans();state.schedule={};
 for(let day=0;day<7;day++){
   const groups=[];
   dayPlan(day).forEach(x=>{if(!groups.includes(x.group))groups.push(x.group)});
   state.schedule[day]=groups;
 }
}
function moveDayExercise(day,index,dir){
 const arr=dayPlan(day),ni=index+dir;if(ni<0||ni>=arr.length)return;
 [arr[index],arr[ni]]=[arr[ni],arr[index]];syncScheduleFromDayPlans();save();
}
function removeDayExercise(day,index){
 dayPlan(day).splice(index,1);syncScheduleFromDayPlans();save();
}

const hadSavedAppState=localStorage.getItem("weightLogExact")!==null; let state=load(); state.theme="steel"; ensureDayPlans(); let activeTab="week"; let logDate=fmtDate(new Date()); let selectedGroup="Biceps", selectedExercise="Dumbbell Curl"; let progressGroup="Biceps",progressExercise="Dumbbell Curl"; let draft=[]; let msgIndex=0; let calDate=new Date(); calDate.setDate(1); let lastLoggedResult=null; let workoutPreviewIndex=0; let workoutPreviewSeenDate=null; let exerciseIntroKey=null; let exerciseIntroTimer=null; let weeklyExpandedDate=null; let lastCelebrationKey=null; let progressMode="strength"; let restTimerInterval=null; let restTimerState={active:false,setIndex:null,target:0,startedAt:0,added:0,elapsed:0,done:false}; let timerAudioCtx=null; let timerAlertsEnabled=localStorage.getItem("overloadTimerAlerts")==="1";
function load(){try{const x=JSON.parse(localStorage.getItem("weightLogExact"));return Object.assign(clone(defaultState),x,{
 settings:Object.assign({},defaultState.settings,x?.settings||{}),
 currentWeights:Object.assign({},defaultState.currentWeights,x?.currentWeights||{}),
 unlocked:Object.assign({},x?.unlocked||{}),
 bodyweightGoal:Object.assign({},defaultState.bodyweightGoal,x?.bodyweightGoal||{})
})}catch(e){return clone(defaultState)}}
function save(){localStorage.setItem("weightLogExact",JSON.stringify(state))}
function applyTheme(){const t=THEMES.steel;document.documentElement.style.setProperty("--accent",t.hex);document.documentElement.style.setProperty("--accent-rgb",t.rgb)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtDate(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function localDate(s){return new Date(s+"T00:00:00")}
function shortDate(s){return localDate(s).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function weekStart(d=new Date()){const x=new Date(d);const day=x.getDay();x.setDate(x.getDate()+((day===0?-6:1)-day));x.setHours(0,0,0,0);return x}
function setting(g,e){const k=cfgKey(g,e);return Object.assign({sets:3,start:8,goal:12,increment:5,rest:120},state.settings[k]||{})}
function setSetting(g,e,p,v){const k=cfgKey(g,e);state.settings[k]=Object.assign({},setting(g,e),{[p]:Number(v)});save()}
function weightOf(sets){return sets.reduce((m,s)=>Math.max(m,Number(s.weight)||0),0)}
function totalReps(sets){return sets.reduce((a,s)=>a+(Number(s.reps)||0),0)}
function volume(sets){return sets.reduce((a,s)=>a+(Number(s.reps)||0)*(Number(s.weight)||0),0)}
function exerciseLogs(g,e){return state.logs.filter(l=>l.group===g&&l.exercise===e&&l.sets?.some(s=>s.reps>0)).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created)}
function sessionOnDate(g,e,date){
 const rows=exerciseLogs(g,e).filter(l=>l.date===date);
 return rows.length?rows[rows.length-1]:null;
}
function logsThroughDate(g,e,date){

function bodyWeightGoalInfo(){
 const goal=state.bodyweightGoal||{mode:"lose",target:null};
 const wt=bodyWeightTrend();
 const target=Number(goal.target)||null;
 const current=wt.current;

 if(current==null || target==null){
   return {mode:goal.mode||"lose",target,current,remaining:null,reached:false,label:"Set a goal"};
 }

 const mode=goal.mode||"lose";
 let remaining=0,reached=false;

 if(mode==="lose"){
   remaining=Math.max(0,current-target);
   reached=current<=target;
 }else if(mode==="gain"){
   remaining=Math.max(0,target-current);
   reached=current>=target;
 }else{
   remaining=Math.abs(current-target);
   reached=remaining<=1;
 }

 return {
   mode,target,current,remaining,reached,
   label:reached
     ? (mode==="maintain"?"In maintenance range":"Goal reached")
     : `${remaining.toFixed(1)} lb ${mode==="maintain"?"from target":"to goal"}`
 };
}

function bodyWeightTrend(){
 const rows=sortedBodyWeights();
 if(!rows.length)return {current:null,weekChange:null,monthChange:null,sevenDayAvg:null,points:[]};

 const current=rows[rows.length-1];
 const currentDate=localDate(current.date);

 const withinDays=(days)=>{
   const cutoff=new Date(currentDate);
   cutoff.setDate(cutoff.getDate()-days);
   return rows.filter(x=>localDate(x.date)>=cutoff && localDate(x.date)<=currentDate);
 };

 const closestAtOrBefore=(target)=>{
   const eligible=rows.filter(x=>localDate(x.date)<=target);
   return eligible.length?eligible[eligible.length-1]:null;
 };

 const seven=withinDays(6);
 const sevenDayAvg=seven.length?seven.reduce((a,x)=>a+Number(x.weight),0)/seven.length:null;

 const weekTarget=new Date(currentDate); weekTarget.setDate(weekTarget.getDate()-7);
 const monthTarget=new Date(currentDate); monthTarget.setDate(monthTarget.getDate()-30);
 const weekBase=closestAtOrBefore(weekTarget);
 const monthBase=closestAtOrBefore(monthTarget);

 return {
   current:Number(current.weight),
   weekChange:weekBase?Number(current.weight)-Number(weekBase.weight):null,
   monthChange:monthBase?Number(current.weight)-Number(monthBase.weight):null,
   sevenDayAvg,
   points:rows.slice(-14)
 };
}

 const y=v=>P+(max-v)/(max-min||1)*(H-P*2);
 const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
 return `<svg class="weight-trend-spark" viewBox="0 0 ${W} ${H}" aria-label="Recent body weight trend"><polyline points="${pts}"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.4"></circle>`).join("")}</svg>`;
}

function calendarDayStatus(ds){
 const planned=scheduledExerciseCountForDate(ds);
 const completed=completedScheduledExerciseCountForDate(ds);
 const today=fmtDate(new Date());

 if(planned===0)return {planned,completed,status:"none"};
 if(ds>today)return {planned,completed,status:"upcoming"};
 if(completed>=planned)return {planned,completed,status:"complete"};
 if(completed>0)return {planned,completed,status:"partial"};
 return {planned,completed,status:"missed"};
}
function monthConsistency(year,month){
 const today=fmtDate(new Date());
 const last=new Date(year,month+1,0);
 let scheduled=0, completed=0, hitDays=0, missedDays=0;
 const statuses=[];

 for(let day=1;day<=last.getDate();day++){
   const d=new Date(year,month,day);
   const ds=fmtDate(d);
   const s=calendarDayStatus(ds);
   statuses.push({date:ds,...s});

   if(s.planned>0 && ds<=today){
     scheduled++;
     if(s.status==="complete"){
       completed++;
       hitDays++;
     }else{
       missedDays++;
     }
   }
 }

 const completion=scheduled?Math.round((completed/scheduled)*100):0;

 // Current streak = consecutive scheduled workout days completed, going backward
 // through scheduled dates up to today. Rest days are skipped.
 let streak=0;
 const eligible=statuses.filter(x=>x.planned>0&&x.date<=today).reverse();
 for(const s of eligible){
   if(s.status==="complete")streak++;
   else break;
 }

 return {completion,scheduled,completed,hitDays,missedDays,streak,statuses};
}

 }

}

function workoutOpportunity(g,e,date=logDate){
 const st=setting(g,e), w=currentWorkingWeightForDate(g,e,date);
 const prev=comparablePreviousLog(g,e,date,w);
 const baseline=!prev;
 const prevReps=prev?prev.sets.slice(0,st.sets).map(x=>Number(x.reps)||0):Array(st.sets).fill(st.start);
 const floor=Math.min(...prevReps);
 const nextRep=baseline?st.start:Math.min(st.goal,Math.max(st.start,floor+(floor<st.goal?1:0)));
 const target=Array(st.sets).fill(nextRep);
 const need=baseline?0:target.reduce((a,r,i)=>a+Math.max(0,r-(prevReps[i]||0)),0);
 const mastery=!baseline&&nextRep===st.goal;
 return {g,e,st,w,prev,baseline,prevReps,target,need,mastery,nextWeight:w+st.increment};
}
function todayOpportunities(date=logDate){return dayPlan(localDate(date).getDay()).map(x=>workoutOpportunity(x.group,x.exercise,date));}
function renderWorkoutPreviewHero(){
 const ops=todayOpportunities(), mastery=ops.filter(x=>x.mastery).length, levels=ops.filter(x=>!x.mastery&&x.prev).length;
 if(!ops.length)return "";
 const seen=workoutPreviewSeenDate===logDate;
 return `<div class="workout-preview-hero ${seen?"previewed":""}"><div class="preview-eyebrow">Before you train</div><div class="preview-title">${seen?"WORKOUT PREVIEW":"SEE WHAT YOU CAN ACCOMPLISH"}</div><div class="sub" style="margin-top:5px">A quick preview of today's targets based on your last performance.</div><div class="preview-summary"><span class="preview-chip">⚡ ${levels} Level-Up Attempt${levels===1?"":"s"}</span>${mastery?`<span class="preview-chip mastery">🏆 ${mastery} Mastery Attempt${mastery===1?"":"s"}</span>`:""}<span class="preview-chip">${ops.length} Exercises</span></div><button id="open-workout-preview" class="btn primary full">${seen?"VIEW AGAIN →":"PREVIEW WORKOUT →"}</button></div>`;
}
function showWorkoutPreview(index=0){
 workoutPreviewSeenDate=logDate;
 const ops=todayOpportunities(); if(!ops.length)return; workoutPreviewIndex=Math.max(0,Math.min(ops.length-1,index)); const o=ops[workoutPreviewIndex];
 const previous=o.prev?o.prevReps.join(" · "):"No prior session"; const target=o.target.join(" · ");
 const opportunityTitle=o.baseline?"◈ LEVEL 1 · FOUNDATION":(o.mastery?"🏆 MASTERY ATTEMPT":"⚡ LEVEL-UP ATTEMPT");
 const opportunityClass=o.mastery?"mastery":"";
 const opportunityMain=o.baseline?`Start at ${o.st.start} reps per set from your ${o.st.start}–${o.st.goal} plan range.`:(o.need?`${o.need} rep${o.need===1?"":"s"} can move you forward.`:"Match or beat your best.");
 const opportunitySub=o.baseline?`Aim for ${target} today. This establishes your Level 1 Foundation and gives Overload the starting point for your next target.`:(o.mastery?`Master ${o.w} lb and put ${o.nextWeight} lb within reach.`:`Build toward the next strength level at ${o.w} lb.`);
 const previewInfo=levelInfoAtWeight(o.g,o.e,o.w,logDate);
 const levelTenure=workoutsAtCurrentLevel(o.g,o.e,o.w,logDate);
 document.getElementById("modal-root").innerHTML=`<div class="modal-bg"><div class="modal preview-modal"><div class="preview-brand">${brandMarkSVG()}</div><div class="preview-slide"><div class="preview-slide-count">${workoutPreviewIndex+1} / ${ops.length}</div><div class="preview-exercise">${o.e.toUpperCase()} · ${o.w} LB</div><div class="preview-comparison"><div class="preview-side"><div class="preview-side-label">Last workout</div><div class="preview-side-reps">${previous}</div></div><div class="preview-arrow">→</div><div class="preview-side today"><div class="preview-side-label">${o.baseline?"Level 1 target":"Today's target"}</div><div class="preview-side-reps">${target}</div></div></div><div class="preview-opportunity"><div class="preview-opportunity-title ${opportunityClass}">${opportunityTitle}</div><div style="font-size:12px;font-weight:700;margin-top:4px">${opportunityMain}</div><div class="sub" style="margin-top:4px">${opportunitySub}</div>${levelTenure?`<div class="preview-level-tenure"><b>${previewInfo.label}</b> · ${levelTenure} workout${levelTenure===1?"":"s"} at this level</div>`:""}</div></div><div class="preview-actions"><button id="preview-prev" class="btn preview-back" ${workoutPreviewIndex===0?"disabled":""}><span class="nav-arrow">←</span><span>BACK</span></button><button id="preview-next" class="btn primary ${workoutPreviewIndex===ops.length-1?"preview-start":""}">${workoutPreviewIndex===ops.length-1?"<span>START WORKOUT</span>":"<span>NEXT</span><span class=\"nav-arrow\">→</span>"}</button><button id="preview-close" class="btn ghost"><span>SKIP</span></button></div></div></div>`;
 document.getElementById("preview-prev").onclick=()=>showWorkoutPreview(workoutPreviewIndex-1);
 document.getElementById("preview-next").onclick=()=>{
   if(workoutPreviewIndex<ops.length-1){
     showWorkoutPreview(workoutPreviewIndex+1);
     return;
   }

   // Starting the workout from the completed preview should feel continuous:
   // close the preview, open the first planned exercise, and preload its draft.
   const first=dayPlan(localDate(logDate).getDay())[0];
   document.getElementById("modal-root").innerHTML="";
   if(first){
     selectedGroup=first.group;
     selectedExercise=first.exercise;
     draft=[];
     lastCelebrationKey=null;
     resetRestTimer();
     initDraft();
     // The completed workout preview already oriented the user to Exercise 1.
     // Open it directly into logging so the Level Card is not repeated back-to-back.
     exerciseIntroKey=null;
   }
   renderLog();
   requestAnimationFrame(()=>{
     const active=document.querySelector(".exercise-head.active");
     if(active)active.scrollIntoView({behavior:"smooth",block:"center"});
   });
   notify("Targets locked in. Let's work.");
 };
 document.getElementById("preview-close").onclick=()=>{document.getElementById("modal-root").innerHTML="";renderLog();};
}
function currentTargetCard(g,e){
 const o=workoutOpportunity(g,e,logDate), entered=draft.slice(0,o.st.sets).map(x=>Number(x.reps)||0), completed=entered.filter(Boolean).length;
 const remaining=o.target.reduce((a,r,i)=>a+Math.max(0,r-(entered[i]||o.prevReps[i]||0)),0);

function workoutRecapData(date=logDate){

 plan.forEach(x=>{const rows=exerciseLogs(x.group,x.exercise).filter(l=>l.date===date); if(!rows.length)return; const cur=rows[rows.length-1], w=weightOf(cur.sets), t=totalReps(cur.sets), prev=previousSameWeightSession(x.group,x.exercise,date,w), pt=prev?totalReps(prev.sets):null; total+=t; if(prev){prevTotal+=pt;comparable++;const delta=t-pt;repGain+=delta;if(delta>0)improved++;today.push({name:x.exercise,now:t,prev:pt,delta});}else today.push({name:x.exercise,now:t,prev:null,delta:null}); const st=setting(x.group,x.exercise),floor=Math.min(...cur.sets.map(s=>Number(s.reps)||0)); if(floor>=st.goal)mastered++; else if(prev){const pf=Math.min(...prev.sets.map(s=>Number(s.reps)||0)); if(floor>pf)levels+=floor-pf;}});

}

async function toggleTimerAlerts(){

   localStorage.setItem("overloadTimerAlerts","0");

   if(btn){
     btn.textContent="🔔 Enable Alerts";

   return;
 }

 try{
   const AudioCtx=window.AudioContext||window.webkitAudioContext;
   if(AudioCtx){
     if(!timerAudioCtx)timerAudioCtx=new AudioCtx();
     if(timerAudioCtx.state==="suspended")await timerAudioCtx.resume();

     const osc=timerAudioCtx.createOscillator();
     const gain=timerAudioCtx.createGain();
     gain.gain.value=0.0001;
     osc.connect(gain);
     gain.connect(timerAudioCtx.destination);
     osc.start();
     osc.stop(timerAudioCtx.currentTime+0.03);
   }

   if("Notification" in window && Notification.permission==="default"){
     try{await Notification.requestPermission()}catch(e){}
   }

   timerAlertsEnabled=true;
   localStorage.setItem("overloadTimerAlerts","1");

   const btn=document.getElementById("rest-enable-alerts");
   if(btn){
     btn.textContent="🔕 Turn Off Alerts";
     btn.classList.add("good");
   }

   notify("Rest timer alerts enabled for all exercises");
 }catch(e){
   notify("Sound alerts could not be enabled");
 }
}

function playTimerBeep(){
 try{
   const AudioCtx=window.AudioContext||window.webkitAudioContext;
   if(!AudioCtx)return;
   if(!timerAudioCtx)timerAudioCtx=new AudioCtx();
   if(timerAudioCtx.state==="suspended")timerAudioCtx.resume();

   const now=timerAudioCtx.currentTime;
   const tones=[
     {t:0.00,f:820,d:.22},
     {t:0.38,f:980,d:.28}
   ];

   tones.forEach(({t,f,d})=>{
     const osc=timerAudioCtx.createOscillator();
     const gain=timerAudioCtx.createGain();
     osc.type="sine";
     osc.frequency.setValueAtTime(f,now+t);
     gain.gain.setValueAtTime(0.0001,now+t);
     gain.gain.exponentialRampToValueAtTime(0.16,now+t+0.015);
     gain.gain.setValueAtTime(0.16,now+t+Math.max(.03,d-.05));
     gain.gain.exponentialRampToValueAtTime(0.0001,now+t+d);
     osc.connect(gain);
     gain.connect(timerAudioCtx.destination);
     osc.start(now+t);
     osc.stop(now+t+d+.02);
   });
 }catch(e){}
}

function formatRestTime(sec){
 sec=Math.max(0,Math.round(Number(sec)||0));
 const m=Math.floor(sec/60),s=sec%60;
 return `${m}:${String(s).padStart(2,"0")}`;
}
function stopRestTimer(){
 if(restTimerInterval){clearInterval(restTimerInterval);restTimerInterval=null;}
}
function resetRestTimer(){
 stopRestTimer();
 restTimerState={active:false,setIndex:null,target:0,startedAt:0,added:0,elapsed:0,done:false};
}
function updateRestTimerUI(){
 const card=document.getElementById("rest-timer-card");
 if(!card||restTimerState.setIndex==null)return;

 if(restTimerState.active){
   restTimerState.elapsed=Math.max(0,Math.floor((Date.now()-restTimerState.startedAt)/1000));
 }

 const st=setting(selectedGroup,selectedExercise);
 const target=Math.max(1,restTimerState.target+restTimerState.added);
 const remaining=Math.max(0,target-restTimerState.elapsed);
 const pct=Math.min(100,restTimerState.elapsed/target);
 const circumference=2*Math.PI*31;

 const time=document.getElementById("rest-timer-time");
 const ring=document.getElementById("rest-timer-ring");
 const ringWrap=document.getElementById("next-set-ring");
 const status=document.getElementById("rest-timer-status");
 const title=document.getElementById("next-set-title");
 const motivationEl=document.getElementById("next-set-motivation");
 const restTargetEl=document.getElementById("next-set-rest-target");
 const consistencyEl=document.getElementById("next-set-consistency");

 const workingWeight=Number(draft[0]?.weight)||currentWorkingWeightForDate(selectedGroup,selectedExercise,logDate)||0;
 const timerPrev=previousSameWeightSession(selectedGroup,selectedExercise,logDate,workingWeight);
 const timerPrevSets=timerPrev?.sets||[];
 const timerInfo=levelInfoAtWeight(selectedGroup,selectedExercise,workingWeight,logDate);
 const isTimerNewCycle=workingWeight>0 && !hasLoggedCurrentWeight(selectedGroup,selectedExercise,workingWeight,logDate);
 const timerNextRep=isTimerNewCycle?st.start:timerInfo.nextRep;

 const nextSetIndex=Math.min(st.sets-1,restTimerState.setIndex+1);
 const prevNextRep=Number(timerPrevSets[nextSetIndex]?.reps)||0;
 const repTarget=prevNextRep>0?prevNextRep+1:timerNextRep;

 if(time)time.textContent=restTimerState.done?"GO!":formatRestTime(remaining);
 if(ring)ring.style.strokeDashoffset=String(circumference*(1-pct));
 if(ringWrap)ringWrap.classList.toggle("ready",restTimerState.done);
 const upcoming=restTimerState.setIndex+2;
 const isFinalUpcoming=upcoming===st.sets;
 const masteryOpportunity=isFinalUpcoming && timerNextRep===st.goal;
 const levelOpportunity=!isTimerNewCycle && timerNextRep>st.start && timerNextRep<=st.goal;

 if(status){
   status.textContent=restTimerState.done
     ? (upcoming>st.sets?"SETS COMPLETE":masteryOpportunity?"MASTER THIS WEIGHT 🏆":levelOpportunity?"LEVEL UP SET 🔥":"LET'S GO!")
     :"NEXT SET";
 }

 if(title){
   title.textContent=upcoming>st.sets ? "WORKOUT SETS COMPLETE" : `SET ${upcoming}`;
 }


 if(motivationEl){
   if(upcoming>st.sets){
     motivationEl.textContent="All sets complete.";
   }else if(prevNextRep>0){
     motivationEl.textContent=`Beat last reps · aim for ${repTarget}+`;
   }else{
     motivationEl.textContent=`Aim for ${repTarget}+ reps`;
   }
 }

 if(restTargetEl)restTargetEl.textContent=`Rest target: ${formatRestTime(target)}`;

 card.classList.toggle("ready-soon",restTimerState.active&&remaining>0&&remaining<=15);
 card.classList.toggle("ready-now",restTimerState.done);

 // Compare today's actual rest with the previous same-weight rest after the same set.
 if(consistencyEl){
   consistencyEl.className="next-set-consistency";
   const prevRest=Number(timerPrevSets[restTimerState.setIndex]?.restAfter);
   const actual=Number(restTimerState.elapsed)||0;

   if(restTimerState.done && prevRest>0){
     const diff=actual-prevRest;
     if(Math.abs(diff)<=10){
       consistencyEl.textContent=`Rest ${formatRestTime(actual)} · ✓ consistent`;
       consistencyEl.classList.add("same");
     }else{
       consistencyEl.textContent=`Rest ${formatRestTime(actual)} · ${Math.abs(diff)} sec ${diff>0?"longer":"shorter"} than last time`;
       consistencyEl.classList.add("diff");
     }
   }else if(prevRest>0){
     consistencyEl.textContent=`Previous rest: ${formatRestTime(prevRest)}`;
     consistencyEl.classList.add("diff");
   }else{
     consistencyEl.textContent="";
   }
 }

 if(restTimerState.active&&remaining<=0){
   restTimerState.active=false;
   restTimerState.done=true;
   stopRestTimer();

   if(draft[restTimerState.setIndex]){
     draft[restTimerState.setIndex].restAfter=restTimerState.elapsed;
   }

   fireRestCompleteAlert();
   updateRestTimerUI();

   setTimeout(()=>{
     const doneCard=document.getElementById("rest-timer-card");
     if(doneCard && restTimerState.done && !restTimerState.active){
       const stNow=setting(selectedGroup,selectedExercise);
       const upcoming=restTimerState.setIndex+2;
       const titleEl=document.getElementById("next-set-title");
       const statusEl=document.getElementById("rest-timer-status");
       const motivationEl=document.getElementById("next-set-motivation");

       const workingWeight=Number(draft[0]?.weight)||currentWorkingWeightForDate(selectedGroup,selectedExercise,logDate)||0;
       const prevSession=previousSameWeightSession(selectedGroup,selectedExercise,logDate,workingWeight);
       const prevSetsLocal=prevSession?.sets||[];
       const nextSetIndex=Math.min(stNow.sets-1,restTimerState.setIndex+1);
       const prevRep=Number(prevSetsLocal[nextSetIndex]?.reps)||0;
       const info=levelInfoAtWeight(selectedGroup,selectedExercise,workingWeight,logDate);
       const isNewCycle=workingWeight>0 && !hasLoggedCurrentWeight(selectedGroup,selectedExercise,workingWeight,logDate);
       const targetRep=prevRep>0 ? prevRep+1 : (isNewCycle?stNow.start:info.nextRep);

       if(statusEl)statusEl.textContent="GO!";
       if(titleEl)titleEl.textContent=upcoming>stNow.sets?"SETS COMPLETE":`SET ${upcoming}`;
       if(motivationEl)motivationEl.textContent=upcoming>stNow.sets?"DONE":`${targetRep}+ REPS`;

       doneCard.classList.add("rest-collapsed");
     }
   },1800);
 }
}
function startRestTimer(setIndex){

   notify("Enter reps before completing the set");
   return;
 }

 const st=setting(selectedGroup,selectedExercise);
 stopRestTimer();

 restTimerState={
   active:true,
   setIndex,
   target:Number(st.rest)||120,
   startedAt:Date.now(),
   added:0,
   elapsed:0,
   done:false
 };

 if(draft[setIndex])draft[setIndex].restAfter=null;

 const card=document.getElementById("rest-timer-card");
 if(card){
   card.style.display="block";
   card.classList.remove("ready-now","ready-soon","rest-collapsed");
 }

 updateRestTimerUI();
 restTimerInterval=setInterval(updateRestTimerUI,250);
}
function skipRestTimer(){

 if(draft[restTimerState.setIndex])draft[restTimerState.setIndex].restAfter=restTimerState.elapsed;
 restTimerState.active=false;restTimerState.done=true;stopRestTimer();updateRestTimerUI();
}
function addRestSeconds(sec){if(restTimerState.setIndex==null)return;restTimerState.added+=Number(sec)||0;updateRestTimerUI();}
function restartRestTimer(){

 const st=setting(selectedGroup,selectedExercise);
 stopRestTimer();
 restTimerState.active=true;
 restTimerState.target=Number(st.rest)||120;
 restTimerState.startedAt=Date.now();
 restTimerState.added=0;
 restTimerState.elapsed=0;

 if(draft[restTimerState.setIndex])draft[restTimerState.setIndex].restAfter=null;

}

function renderEntry(prev){
 const panel=document.getElementById("entry-panel");
 if(!panel)return;

 const st=setting(selectedGroup,selectedExercise);
 const configuredWeight=currentWorkingWeightForDate(selectedGroup,selectedExercise,logDate);

 if(!draft.length || draft.length!==st.sets){
   initDraft();
 }

 const workingWeight=Number(draft[0]?.weight)||configuredWeight||0;
 const introKey=`${logDate}|${selectedGroup}|${selectedExercise}`;
 if(exerciseIntroKey===introKey){
   const introInfo=levelInfoAtWeight(selectedGroup,selectedExercise,workingWeight,logDate);
   const introTenure=workoutsAtCurrentLevel(selectedGroup,selectedExercise,workingWeight,logDate);
   const stIntro=setting(selectedGroup,selectedExercise);
   const introMastered=introInfo.mastered;
   const introLevel=Math.max(1,introInfo.level+1);
   const masteryIndex=Math.max(1,stIntro.goal-stIntro.start+1);
   const nextRep=Math.min(stIntro.goal,stIntro.start+introLevel);
   const nextTarget=Array(stIntro.sets).fill(nextRep).join(" · ");

     });

function maybeCelebrate(){
 const st=setting(selectedGroup,selectedExercise);
 if(draft.length<st.sets)return;

 const reps=draft.slice(0,st.sets).map(x=>Number(x.reps)||0);
 if(reps.some(r=>r<=0))return;

 const w=Number(draft[0]?.weight)||currentWorkingWeight(selectedGroup,selectedExercise)||0;
 const savedInfo=levelInfoAtWeight(selectedGroup,selectedExercise,w);

 // Award the highest level actually earned by the weakest prescribed set.
 // This intentionally allows the user to skip levels.
 const floor=Math.min(...reps);
 const maxLevel=st.goal-st.start;
 const achievedLevel=Math.max(0,Math.min(maxLevel,floor-st.start));
 const isMastery=achievedLevel===maxLevel;

 if(achievedLevel<=savedInfo.level && !isMastery)return;

 const key=[selectedGroup,selectedExercise,w,...reps].join("|");
 if(lastCelebrationKey===key)return;
 lastCelebrationKey=key;

 showLevelPopup(achievedLevel,isMastery,reps,savedInfo.level);
}

function showExerciseFinishCelebration(){

   weight:Number(x.weight)||0,

   restAfter:x.restAfter==null?null:Number(x.restAfter)||0
 }));

 if(!sets.length || sets.some(s=>!s.reps))return;

 const w=weightOf(sets);
 const total=totalReps(sets);
 const prevSame=previousSameWeightSession(selectedGroup,selectedExercise,logDate,w);
 const prevTotal=prevSame?totalReps(prevSame.sets):null;
 const delta=prevSame?total-prevTotal:null;

 const floor=Math.min(...sets.map(s=>Number(s.reps)||0));
 const earnedLevel=Math.max(0,Math.min(st.goal-st.start,floor-st.start));
 const mastered=earnedLevel===st.goal-st.start;
 const levelNum=earnedLevel+1;

 const priorInfo=levelInfoAtWeight(selectedGroup,selectedExercise,w,logDate);

 const card=document.getElementById("rest-timer-card");
 if(!card)return;

 let headline="SETS COMPLETE";
 let subline=`${total} total reps`;
 let detail=delta==null
   ? `${w} lb · session complete`
   : delta>0
     ? `+${delta} reps vs last workout`
     : delta===0
       ? `Matched your last workout`
       : `${Math.abs(delta)} reps below last workout`;

 const newlyMastered=mastered && !priorInfo.mastered;
 const newlyLeveled=!mastered && earnedLevel>priorInfo.level;
 if(newlyMastered){
   headline="WEIGHT MASTERED";
   subline=`${w} lb conquered`;
   detail=`${sets.map(s=>s.reps).join(" · ")} · next weight ready`;
 }else if(newlyLeveled){
   headline=`LEVEL ${levelNum} ACHIEVED`;
   subline=`${sets.map(s=>s.reps).join(" · ")} at ${w} lb`;

 card.style.display="block";
 card.classList.remove("ready-soon","ready-now","rest-collapsed");
 card.classList.add("exercise-finish-card");

function saveExercise(){
 const st=setting(selectedGroup,selectedExercise);
 const sets=draft.slice(0,st.sets).map(x=>({
   weight:Number(x.weight)||0,
   reps:Number(x.reps)||0,
   restAfter:x.restAfter==null?null:Number(x.restAfter)||0
 }));

 if(!sets.length || sets.some(s=>!s.reps)){
   notify("Enter reps for every prescribed set");
   return;
 }

 const w=weightOf(sets);
 const prevSame=previousSameWeightSession(selectedGroup,selectedExercise,logDate,w);
 const prevTotal=prevSame?totalReps(prevSame.sets):null;
 const total=totalReps(sets);
 const delta=prevSame?total-prevTotal:null;
 const plateauBroken=plateauOutcomeForSets(selectedGroup,selectedExercise,w,logDate,sets);

 const existingIndex=state.logs.findIndex(l=>
   l.date===logDate &&
   l.group===selectedGroup &&
   l.exercise===selectedExercise &&
   weightOf(l.sets)===w
 );

 const record={
   id:existingIndex>=0?state.logs[existingIndex].id:uid(),
   created:existingIndex>=0?state.logs[existingIndex].created:Date.now(),
   updated:Date.now(),
   date:logDate,
   group:selectedGroup,
   exercise:selectedExercise,
   sets
 };

 if(existingIndex>=0)state.logs[existingIndex]=record;
 else state.logs.push(record);

 const exerciseKey=cfgKey(selectedGroup,selectedExercise);

 // Highest earned level comes directly from the lowest completed set.
 // Example: if the user goes from 8/8/8 straight to 11/11/11,
 // they immediately earn the 11-rep level instead of being forced through 9 and 10.
 const floor=Math.min(...sets.map(s=>Number(s.reps)||0));
 const earnedLevel=Math.max(0,Math.min(st.goal-st.start,floor-st.start));
 const mastered=earnedLevel===st.goal-st.start;

 if(mastered){
   const existingUnlocked=Number(state.unlocked[exerciseKey])||0;
   const nextWeight=existingUnlocked>w ? existingUnlocked : w+st.increment;

   // The mastered weight is finished. Persist the next weight immediately so
   // every future workout date starts at the newly unlocked working weight.
   state.unlocked[exerciseKey]=nextWeight;
   state.currentWeights[exerciseKey]=nextWeight;
 }else{
   state.currentWeights[exerciseKey]=w;

   // Once an unlocked weight becomes the active working weight, it is no longer
   // merely pending; currentWeights now owns that state.
   if(Number(state.unlocked[exerciseKey])===w){
     delete state.unlocked[exerciseKey];
   }
 }

 if(mastered && !state.achievements.some(a=>
   a.date===logDate &&
   a.type==="mastery" &&
   a.group===selectedGroup &&
   a.exercise===selectedExercise &&
   a.weight===w
 )){
   state.achievements.push({
     date:logDate,
     type:"mastery",
     group:selectedGroup,
     exercise:selectedExercise,
     weight:w
   });
 }

 lastLoggedResult={
   group:selectedGroup,
   exercise:selectedExercise,
   weight:w,
   total,
   prevTotal,
   delta,
   isPR:prevSame ? total>prevTotal : false,
   earnedLevel:earnedLevel+1,
   mastered,
   plateauBroken,
   stillToBeat:activePlateaus(selectedGroup,selectedExercise,w,logDate,false)
 };

 save();

 draft=sets.map(s=>({
   weight:String(s.weight),
   reps:String(s.reps),
   restAfter:s.restAfter==null?null:Number(s.restAfter)
 }));

 notify(existingIndex>=0?"Exercise updated":"Exercise logged");
 renderLog();

 if(mastered){
   setTimeout(()=>showMasteryUnlockPopup(selectedGroup,selectedExercise,w),80);
 }
}

function calendarDetail(ds){
 const d=localDate(ds);
 const groups=state.schedule[d.getDay()]||[];
 const today=fmtDate(new Date());

 const rows=groups.flatMap(g=>
   (state.exercises[g]||[]).map(e=>{

function drawChart(sr,type,st){

 const vals=sr.slice(-10).map(r=>type==="reps"?r.totalReps:type==="weight"?r.weight:type==="volume"?r.volume:r.est1rm),labels=sr.slice(-10).map(r=>shortDate(r.date));let min=Math.min(...vals),max=Math.max(...vals);if(type==="reps"){min=Math.min(min,st.sets*st.start);max=Math.max(max,st.sets*st.goal)}const pad=Math.max(1,(max-min)*.18);min=Math.max(0,min-pad);max=max+pad;const W=560,H=190,L=38,R=10,T=16,B=28;const x=i=>L+(vals.length===1?0:(i/(vals.length-1))*(W-L-R)),y=v=>T+(max-v)/(max-min||1)*(H-T-B);let grid="";for(let i=0;i<5;i++){const v=max-(i/4)*(max-min),yy=y(v);grid+=`<line class="grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text x="2" y="${yy+3}">${Math.round(v)}</text>`}const points=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");let target="";if(type==="reps"){const g=st.sets*st.goal,yy=y(g);target=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#5FAE7A" stroke-dasharray="5 4"/><text x="${W-118}" y="${yy-5}" fill="#5FAE7A">Mastery ${g}</text>`}el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${type} progression chart">${grid}${target}<polyline points="${points}"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4"><title>${labels[i]} — ${v}</title></circle><text x="${x(i)}" y="${H-7}" text-anchor="middle">${labels[i]}</text>`).join("")}</svg>`;
}
function journeyCards(g,e){const sr=series(g,e),st=setting(g,e),by={};sr.forEach(r=>by[r.weight]=(by[r.weight]||false)||r.mastered);const current=sr.length?sr[sr.length-1].weight:(state.currentWeights[cfgKey(g,e)]||0);const weights=Object.keys(by).map(Number).sort((a,b)=>a-b);if(current&&!weights.includes(current))weights.push(current);let html=weights.map(w=>`<div class="weight-card ${by[w]?"mastered":w===current?"current":""}"><div class="mono" style="font-weight:700">${w} lb</div><div style="font-size:10px;margin-top:3px">${by[w]?"✓ MASTERED":w===current?"CURRENT":"PAST"}</div></div>`).join("");if(by[current]){const next=state.unlocked[cfgKey(g,e)]||current+st.increment;const unlocked=!!state.unlocked[cfgKey(g,e)];html+=`<div class="weight-card ${unlocked?"current":"unlockable"}" id="next-weight"><div class="mono" style="font-weight:700">${next} lb</div><div style="font-size:10px;margin-top:3px">${unlocked?"CURRENT":"🔒 TAP TO START"}</div></div>`}return html}

function unlockPanel(g,e){const info=strengthInfo(g,e),st=setting(g,e),suggest=info.weight+st.increment;document.getElementById("unlock-area").innerHTML=`<div class="card" style="margin-top:8px;border-color:var(--accent)"><div class="sub">🏆 ${info.weight} lb mastered — choose your next working weight</div><div class="row" style="margin:10px 0"><button id="uwminus" class="btn">−</button><input id="uw" class="input mono" type="number" value="${suggest}" style="text-align:center"><button id="uwplus" class="btn">+</button></div><button id="uwgo" class="btn primary full">UNLOCK ${suggest} LB</button></div>`;const inp=document.getElementById("uw"),upd=()=>document.getElementById("uwgo").textContent="UNLOCK "+inp.value+" LB";document.getElementById("uwminus").onclick=()=>{inp.value=Math.max(1,Number(inp.value)-5);upd()};document.getElementById("uwplus").onclick=()=>{inp.value=Number(inp.value)+5;upd()};inp.oninput=upd;document.getElementById("uwgo").onclick=()=>{const v=Number(inp.value);state.unlocked[cfgKey(g,e)]=v;state.currentWeights[cfgKey(g,e)]=v;save();notify(v+" lb unlocked — new cycle starts at "+st.start+" reps");renderProgress()}}

       <button type="button" id="ok-${day}" class="btn primary">Add to ${names[day]}</button>
       <button type="button" id="cx-${day}" class="btn ghost">Cancel</button>
     </div>
   </div>`;

   const gs=document.getElementById("g-"+day);
   const es=document.getElementById("e-"+day);

   const fill=()=>{
     es.innerHTML=(state.exercises[gs.value]||[]).map(e=>`<option>${e}</option>`).join("");
   };
   fill();
   gs.onchange=fill;

   document.getElementById("ok-"+day).onclick=()=>{
     const g=gs.value,e=es.value;
     if(!g||!e)return;

     if(dayPlan(day).some(x=>x.group===g&&x.exercise===e)){
       notify("Exercise already scheduled that day");
       return;
     }

     state.dayPlans[day].push({group:g,exercise:e});
     syncScheduleFromDayPlans();
     save();
     renderPlan();
   };

   document.getElementById("cx-"+day).onclick=()=>{panel.innerHTML=""};
 });

 // REORDER / REMOVE EXERCISE FROM DAY
 document.querySelectorAll("[data-up]").forEach(btn=>btn.onclick=()=>{
   const [day,i]=btn.dataset.up.split("|").map(Number);
   moveDayExercise(day,i,-1);
   renderPlan();
 });

 document.querySelectorAll("[data-down]").forEach(btn=>btn.onclick=()=>{
   const [day,i]=btn.dataset.down.split("|").map(Number);
   moveDayExercise(day,i,1);
   renderPlan();
 });

 document.querySelectorAll("[data-rm]").forEach(btn=>btn.onclick=()=>{
   const [day,i]=btn.dataset.rm.split("|").map(Number);
   removeDayExercise(day,i);
   renderPlan();
 });

 // CLEAR DATA
 document.getElementById("clear-app-data").onclick=()=>{
   if(!confirm("Clear all saved workout and progress data from this device?"))return;

   localStorage.setItem("overloadUserClearedData","1");
   state=clone(defaultState);
   state.theme="steel";
   state.logs=[];
   state.bodyweight=[];
   state.achievements=[];
   state.unlocked={};
   state.currentWeights={};
   state.dayPlans={};
   ensureDayPlans();

   logDate=fmtDate(new Date());
   selectedGroup=state.groups[0]||"";
   selectedExercise="";
   progressGroup=state.groups[0]||"";
   progressExercise=(state.exercises[progressGroup]||[])[0]||"";
   draft=[];
   lastLoggedResult=null;
   weeklyExpandedDate=null;
   lastCelebrationKey=null;

   save();
   applyTheme();
   notify("All workout data cleared");
   renderPlan();
 };

 document.getElementById("load-demo-data").onclick=()=>{
   if(!confirm("Load the built-in demo data? This will replace the current workout progress on this device."))return;

   localStorage.removeItem("overloadUserClearedData");
   state=clone(defaultState);
   state.theme="steel";
   state.logs=[];
   state.bodyweight=[];
   state.achievements=[];
   state.unlocked={};
   state.dayPlans={};
   ensureDayPlans();

   // Seed demo explicitly even though this browser has saved state.
   const now=new Date();
   const dateOff=i=>{const d=new Date(now);d.setDate(now.getDate()+i);return fmtDate(d)};

   state.settings["Biceps::Dumbbell Curl"]={sets:3,start:8,goal:12,increment:5,rest:120};
   state.settings["Glutes::Hip Thrust"]={sets:3,start:8,goal:12,increment:10,rest:120};
   state.settings["Shoulders::Lateral Raise"]={sets:3,start:8,goal:12,increment:5,rest:120};

   state.logs=[
     {id:uid(),created:1,date:dateOff(-9),group:"Biceps",exercise:"Dumbbell Curl",sets:[{weight:50,reps:9},{weight:50,reps:9},{weight:50,reps:8}]},
     {id:uid(),created:2,date:dateOff(-3),group:"Chest",exercise:"Dumbbell Press",sets:[{weight:60,reps:10},{weight:60,reps:9},{weight:60,reps:9}]},
     {id:uid(),created:3,date:dateOff(-1),group:"Biceps",exercise:"Dumbbell Curl",sets:[{weight:50,reps:10},{weight:50,reps:10},{weight:50,reps:9}]},
     {id:uid(),created:4,date:dateOff(-8),group:"Glutes",exercise:"Hip Thrust",sets:[{weight:135,reps:12},{weight:135,reps:11},{weight:135,reps:11}]},
     {id:uid(),created:5,date:dateOff(-2),group:"Glutes",exercise:"Hip Thrust",sets:[{weight:135,reps:12},{weight:135,reps:12},{weight:135,reps:11}]},
     {id:uid(),created:6,date:dateOff(-4),group:"Shoulders",exercise:"Lateral Raise",sets:[{weight:20,reps:12},{weight:20,reps:12},{weight:20,reps:12}]}
   ];

   logDate=fmtDate(new Date());
   selectedGroup="Biceps";
   selectedExercise="Dumbbell Curl";
   progressGroup="Biceps";
   progressExercise="Dumbbell Curl";
   draft=[];
   lastLoggedResult=null;
   weeklyExpandedDate=null;
   lastCelebrationKey=null;

   save();
   applyTheme();
   notify("Demo data loaded");
   renderPlan();
 };
}
